name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run quartz -- plugin install

      - name: Prepare private content
        env:
          MEMOIR_MARKDOWN_B64: ${{ secrets.MEMOIR_MARKDOWN_B64 }}
          MEMOIR_PASSWORD: ${{ secrets.MEMOIR_PASSWORD }}
        run: node scripts/private/build-memoir.mjs

      - name: Build site
        run: npm run build:site

      - name: Remove private source
        if: always()
        run: rm -rf content/培琳

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
